# Dataset
train_gt_dir: "dataset/train/train/GT"
train_noisy_dir: "dataset/train/train/NoisyLR"
val_split_ratio: 0.1
gt_crop_size: 128
synthesize_prob: 0.5

# Model
in_channels: 1
out_channels: 1
num_features: 64
num_res_blocks: 16

# Training (Fine-tuning)
batch_size: 32 # Adjust based on GPU memory
warmup_epochs: 5
hetero_epochs: 15
learning_rate: 0.00002
warmup_lr: 0.0001
num_workers: 8 # Adjust based on CPU cores
seed: 1234

# Loss weights
lambda_l1: 1.0
lambda_ssim: 0.5
lambda_lpips: 0.5
lambda_hetero: 1.0

# Paths
save_dir: "weights"
results_dir: "results"
