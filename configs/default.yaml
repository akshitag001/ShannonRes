# Dataset
train_gt_dir: "../dataset/train/train/GT"
train_noisy_dir: "../dataset/train/train/NoisyLR"
val_split_ratio: 0.1
gt_crop_size: 128
synthesize_prob: 0.5

# Model
in_channels: 1
out_channels: 1
num_features: 64
num_res_blocks: 16

# Training
batch_size: 32 # Adjust based on GPU memory
num_epochs: 200
learning_rate: 0.0002
num_workers: 8 # Adjust based on CPU cores
seed: 42

# Loss weights
lambda_l1: 1.0
lambda_ssim: 0.5
lambda_lpips: 0.5

# Paths
save_dir: "weights"
results_dir: "results"
